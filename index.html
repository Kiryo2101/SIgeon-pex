<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clicker Template</title>
<style>
  :root {
    --bg: #1a1a2e;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: white;
    user-select: none;
    overflow: hidden;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
    letter-spacing: 1px;
    text-align: center;
    padding: 0 1rem;
  }
  #counter {
    font-size: 3.5rem;
    font-weight: 800;
    margin-bottom: 1.5rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #click-wrap {
    position: relative;
    cursor: pointer;
    touch-action: manipulation;
    width: 260px;
    height: 260px;
  }
  #click-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform 0.06s ease;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #img-b {
    position: absolute;
    top: 0;
    left: 0;
    display: none;
  }
  #click-wrap.clicked img {
    transform: scale(0.88);
  }
  .pop-text {
    position: absolute;
    top: -10px;
    font-weight: 800;
    color: var(--accent);
    font-size: 1.4rem;
    pointer-events: none;
    animation: floatUp 0.6s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -60px); }
  }
  #reset {
    margin-top: 2rem;
    background: none;
    border: 1px solid #555;
    color: #999;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #reset:hover { color: white; border-color: #888; }

  /* Fallback boxes so the template still shows something before you add images */
  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #333;
    border: 2px dashed #666;
    border-radius: 20px;
    font-size: 0.88rem;
    color: #999;
    text-align: center;
    padding: 1rem;
  }
</style>
</head>
<body>

  <h1 id="title">Click</h1>
  <div id="counter">0</div>

  <div id="click-wrap">
    <!-- STATE A: default image -->
    <img id="img-a" src="nok1.png" alt="state A"
         onerror="this.style.display='none'; document.getElementById('ph-a').style.display='flex';">
    <div id="ph-a" class="placeholder" style="display:none;">Put image A's<br>URL/path in img-a's src</div>

    <!-- STATE B: shown briefly on click -->
    <img id="img-b" src="nok2.png" alt="state B"
         onerror="this.style.display='none'; document.getElementById('ph-b').style.display='flex';">
    <div id="ph-b" class="placeholder" style="display:none;">Put image B's<br>URL/path in img-b's src</div>
  </div>

  <button id="reset">Reset counter</button>

<script>
  // ======== EASY CONFIG — edit these ========
  const CONFIG = {
    title: "Click",              // page heading
    storageKey: "clickerCount",     // localStorage key (change if running multiple clickers on same domain)
    soundOn: true,                  // toggle click sound
    soundFreqA: 220,                // pitch for state A click (Hz)
    soundFreqB: 420                 // pitch for state B click (Hz)
  };
  // ===========================================

  document.getElementById('title').textContent = CONFIG.title;

  const clickWrap = document.getElementById('click-wrap');
  const imgA = document.getElementById('img-a');
  const imgB = document.getElementById('img-b');
  const counterEl = document.getElementById('counter');
  const resetBtn = document.getElementById('reset');

  let count = parseInt(localStorage.getItem(CONFIG.storageKey) || '0', 10);
  let showingB = false;
  counterEl.textContent = count;

  function playPop(pitch) {
    if (!CONFIG.soundOn) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(pitch, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch (e) { /* audio not available, ignore */ }
  }

  function click(e) {
    showingB = !showingB;
    imgA.style.display = showingB ? 'none' : 'block';
    imgB.style.display = showingB ? 'block' : 'none';

    count++;
    counterEl.textContent = count;
    localStorage.setItem(CONFIG.storageKey, count);

    playPop(showingB ? CONFIG.soundFreqB : CONFIG.soundFreqA);

    clickWrap.classList.add('clicked');
    setTimeout(() => clickWrap.classList.remove('clicked'), 80);

    const rect = clickWrap.getBoundingClientRect();
    const x = e.clientX ? e.clientX - rect.left : rect.width / 2;
    const floatEl = document.createElement('div');
    floatEl.className = 'pop-text';
    floatEl.style.left = x + 'px';
    floatEl.textContent = '+1';
    clickWrap.appendChild(floatEl);
    setTimeout(() => floatEl.remove(), 600);
  }

  clickWrap.addEventListener('click', click);

  resetBtn.addEventListener('click', () => {
    count = 0;
    counterEl.textContent = 0;
    localStorage.setItem(CONFIG.storageKey, 0);
  });
</script>

</body>
</html>
