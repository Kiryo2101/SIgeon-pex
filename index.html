<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PopCat Clone</title>
<style>
  :root {
    --bg: #1a1a2e;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: white;
    user-select: none;
    overflow: hidden;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
    letter-spacing: 1px;
  }
  #counter {
    font-size: 3.5rem;
    font-weight: 800;
    margin-bottom: 1.5rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #cat-wrap {
    position: relative;
    cursor: pointer;
    touch-action: manipulation;
  }
  #cat {
    width: 260px;
    height: 260px;
    transition: transform 0.06s ease;
  }
  #cat-wrap:active #cat,
  #cat-wrap.clicked #cat {
    transform: scale(0.88);
  }
  .pop-text {
    position: absolute;
    top: -10px;
    font-weight: 800;
    color: var(--accent);
    font-size: 1.4rem;
    pointer-events: none;
    animation: floatUp 0.6s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -60px); }
  }
  #reset {
    margin-top: 2rem;
    background: none;
    border: 1px solid #555;
    color: #999;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #reset:hover { color: white; border-color: #888; }
</style>
</head>
<body>

  <h1>POP THE CAT</h1>
  <div id="counter">0</div>

 
  <div id="click-wrap">
    <!-- STATE A: default image -->
    <img id="img-a" src="nok1.png" alt="state A"
         onerror="this.style.display='none'; document.getElementById('ph-a').style.display='flex';">
    <div id="ph-a" class="placeholder" style="display:none;">Put image A's<br>URL/path in img-a's src</div>
 
    <!-- STATE B: shown briefly on click -->
    <img id="img-b" src="nok2.png" alt="state B"
         onerror="this.style.display='none'; document.getElementById('ph-b').style.display='flex';">
    <div id="ph-b" class="placeholder" style="display:none;">Put image B's<br>URL/path in img-b's src</div>
  </div>

  <button id="reset">Reset counter</button>

<script>
  const catWrap = document.getElementById('cat-wrap');
  const mouthClosed = document.getElementById('mouthClosed');
  const mouthOpen = document.getElementById('mouthOpen');
  const counterEl = document.getElementById('counter');
  const resetBtn = document.getElementById('reset');

  let count = parseInt(localStorage.getItem('popcatCount') || '0', 10);
  let isOpen = false;
  counterEl.textContent = count;

  // Simple pop sound generated on the fly (no external file needed)
  function playPop() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(isOpen ? 420 : 220, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  }

  function pop(e) {
    isOpen = !isOpen;
    mouthOpen.style.display = isOpen ? 'block' : 'none';
    mouthClosed.style.display = isOpen ? 'none' : 'block';

    count++;
    counterEl.textContent = count;
    localStorage.setItem('popcatCount', count);

    playPop();

    catWrap.classList.add('clicked');
    setTimeout(() => catWrap.classList.remove('clicked'), 80);

    // floating "+1"
    const rect = catWrap.getBoundingClientRect();
    const x = e.clientX ? e.clientX - rect.left : rect.width / 2;
    const floatEl = document.createElement('div');
    floatEl.className = 'pop-text';
    floatEl.style.left = x + 'px';
    floatEl.textContent = '+1';
    catWrap.appendChild(floatEl);
    setTimeout(() => floatEl.remove(), 600);
  }

  catWrap.addEventListener('click', pop);

  resetBtn.addEventListener('click', () => {
    count = 0;
    counterEl.textContent = 0;
    localStorage.setItem('popcatCount', 0);
  });
</script>

</body>
</html>
